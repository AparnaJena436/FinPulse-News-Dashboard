<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinPulse - Financial News Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📊 FinPulse</h1>
        <p>Financial News & Market Sentiment Dashboard</p>
    </header>

    <main>

        <!-- Sentiment Section -->
        <section class="sentiment-section">

            <div class="sentiment-card">
                <h2>🇮🇳 India Market Sentiment</h2>
                <div id="indiaSentiment">Loading...</div>
            </div>

            <div class="sentiment-card">
                <h2>🌎 Global Market Sentiment</h2>
                <div id="globalSentiment">Loading...</div>
            </div>

        </section>


        <!-- India News -->
        <section class="news-section">

            <h2>🇮🇳 India Financial News</h2>

            <div id="indiaNews" class="news-container">
                Loading news...
            </div>

        </section>


        <!-- Global News -->
        <section class="news-section">

            <h2>🌎 Global Financial News</h2>

            <div id="globalNews" class="news-container">
                Loading news...
            </div>

        </section>

    </main>


    <footer>
        <p>FinPulse | Financial News Dashboard</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
