<!-- Dual Sentiment Meters Banner -->
    <section class="dual-sentiment-banner">
      
      <!-- India Market Mood Card -->
      <div class="card sentiment-card india-card">
        <div class="card-header">
          <span class="region-flag">🇮🇳</span>
          <h2>India Market Mood</h2>
        </div>
        <div id="indiaStatus" class="sentiment-status">Calculating India mood...</div>
        
        <div class="gauge-container">
          <div class="gauge-bar">
            <div id="indiaGaugePointer" class="gauge-pointer" style="left: 50%;"></div>
          </div>
          <div class="gauge-labels">
            <span class="bearish">Bearish</span>
            <span class="neutral">Neutral</span>
            <span class="bullish">Bullish</span>
          </div>
        </div>

        <div class="sentiment-score-box">
          <span id="indiaScore">0</span>
          <label>India Sentiment Score</label>
        </div>
      </div>

      <!-- Global Market Mood Card -->
      <div class="card sentiment-card global-card">
        <div class="card-header">
          <span class="region-flag">🌐</span>
          <h2>Global Market Mood</h2>
        </div>
        <div id="globalStatus" class="sentiment-status">Calculating Global mood...</div>
        
        <div class="gauge-container">
          <div class="gauge-bar">
            <div id="globalGaugePointer" class="gauge-pointer" style="left: 50%;"></div>
          </div>
          <div class="gauge-labels">
            <span class="bearish">Bearish</span>
            <span class="neutral">Neutral</span>
            <span class="bullish">Bullish</span>
          </div>
        </div>

        <div class="sentiment-score-box">
          <span id="globalScore">0</span>
          <label>Global Sentiment Score</label>
        </div>
      </div>

    </section>
